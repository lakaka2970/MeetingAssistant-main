[package]
name = "meeting-copilot-audio"
version = "0.1.0"
edition = "2021"
description = "Native audio capture for MeetingCopilot: Windows WASAPI loopback + mic, resampled to 16 kHz mono f32"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "2.16", features = ["napi8"] }
napi-derive = "2.16"
cpal = "0.15"

[target.'cfg(windows)'.dependencies]
wasapi = "0.15"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
strip = "symbols"

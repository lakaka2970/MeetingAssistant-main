appId: com.lakaka2970.meetingassistant
productName: MeetingAssistant
copyright: Copyright © 2025 lakaka2970

directories:
  buildResources: build
  output: release

# Only the compiled bundles ship. Production node_modules are added by
# electron-builder itself (it walks the prod dependency tree separately), so
# they must NOT be listed here. The negative patterns below are belt-and-braces
# documentation of what must never reach a user's disk -- docs/ alone carries a
# 6.8 MB demo video plus GIFs.
files:
  - out/**
  - package.json
  - '!src/**'
  - '!test/**'
  - '!docs/**'
  - '!tools/**'
  - '!patches/**'
  - '!build/**'
  - '!.github/**'
  - '!**/*.md'
  - '!**/*.tsbuildinfo'
  - '!electron.vite.config.ts'
  - '!tsconfig*.json'
  - '!**/{.npmrc,.editorconfig,start.bat,start-funasr-local.bat}'
  # Upstream packages carry 691 sourcemaps (69 MB) and 374 loose .ts files into
  # app.asar. None of them are ours, but a .map is literally restorable source,
  # and no runtime path reads one -- the bundles are imported by their own file
  # names. Stripping both also shrinks the installer by that 69 MB.
  - '!**/*.map'
  - '!**/*.ts'
  - '!**/*.tsx'
  # ---- platform-independent dead weight (validated on a Linux build; the same
  # files are unused on Windows because every target runs the Node bundle) ----
  # 65.8 MB of browser-only ONNX Runtime (52 MB of .wasm plus every ort.*.js
  # variant). transformers.js bundles `onnxruntime-web` as an IGNORED module in
  # its Node build, so the dynamic import can never resolve from Electron's main
  # process — verified by loading the packaged transformers.node.mjs with these
  # excluded. Both spellings of the jsep artifact are listed because the install
  # tree and the packaged tree name it differently.
  - '!node_modules/onnxruntime-web/**'
  - '!node_modules/@huggingface/transformers/dist/ort-wasm-simd-threaded.jsep.wasm'
  - '!node_modules/@huggingface/transformers/dist/ort-wasm-simd-threaded.jsep.mjs'
  - '!node_modules/@huggingface/transformers/dist/jsep.wasm'
  - '!node_modules/@huggingface/transformers/dist/jsep.mjs'
  # pdf-parse imports pdfjs-dist/legacy/build/pdf.mjs; build/ and web/ are never
  # loaded (verified: docparse + knowledge-import specs pass with them absent)
  - '!node_modules/pdfjs-dist/build/**'
  - '!node_modules/pdfjs-dist/web/**'

asar: true
# The app is zh/en only; Electron otherwise ships ~50 locale .pak files (46 MB)
# and every unused one falls back to en-US anyway.
electronLanguages:
  - zh-CN
  - en-US
# @huggingface/transformers is loaded through a dynamic ESM import of
# transformers.node.mjs (electron/asr/engine.ts); an app.asar file:// URL is not
# importable, and the silent CJS fallback would drop our cache_position patch.
# onnxruntime-node carries native .node/.dll payloads. electron-builder already
# auto-unpacks module roots containing native binaries, but onnxruntime-node is
# pinned explicitly so a future detector change cannot break local Whisper.
asarUnpack:
  - node_modules/@huggingface/transformers/**
  - node_modules/onnxruntime-node/**

# Python sidecar scripts must live on the real filesystem (spawned by a Python
# interpreter, never through Electron's asar shim). Packaged layout:
#   resources/tools/*.py           <- getResourceRoot() + 'tools'
#   resources/requirements-*.txt
# funasr_stream_server.py imports funasr_device, moss_asr_server.py imports
# moss_asr_utils -- sibling imports resolved via the script directory, so all
# four files must land in the same folder.
extraResources:
  - from: tools
    to: tools
    filter:
      - funasr_stream_server.py
      - funasr_device.py
      - moss_asr_server.py
      - moss_asr_utils.py
  - from: requirements-funasr.txt
    to: requirements-funasr.txt
  - from: requirements-moss.txt
    to: requirements-moss.txt
  # Connection-test fixtures (electron/providerTest.ts): a ~1.4 s 16 kHz mono
  # TTS clip per language and a 64x64 PNG. They carry no user data. The `to`
  # path mirrors the repo-relative path on purpose -- getResourceRoot() is the
  # repo root in dev and `resources/` when packaged, so
  # join(root, 'resources', ...) resolves on both sides with no branch.
  - from: resources/test-audio
    to: resources/test-audio
    filter:
      - '*.wav'
  - from: resources/test-image.png
    to: resources/test-image.png
  # System-tray icons (electron/tray.ts). Same mirrored-path trick as the test
  # fixtures above: trayIconPath() joins getResourceRoot() + 'resources/tray',
  # which is the repo folder in dev and this one once packaged.
  - from: resources/tray
    to: resources/tray
    filter:
      - '*.png'
  # The mobile display page (electron/companion/server.ts). It is served to a
  # phone's browser as plain files, so it must live on a real filesystem path
  # like the python sidecars -- and it must NOT go through the renderer's vite
  # build, which would bundle it into app.asar where the HTTP route cannot read
  # it by path.
  - from: resources/companion
    to: resources/companion
    filter:
      - '*.html'
      - '*.js'
  # Builtin skill directives (electron/skills/manager.ts, upgrade P3): loaded
  # from getResourceRoot() + 'resources/skills' on both dev and packaged runs.
  - from: resources/skills
    to: resources/skills
    filter:
      - '*.md'
  # Optional native audio module (rust/, upgrade P1.5) — only present when a
  # developer ran `npm run native:build`. electron-builder errors on a missing
  # `from`, so keep this entry LAST and remove it in build pipelines without
  # the artifact (the app degrades to Web Audio gracefully either way).
  - from: resources/native
    to: resources/native
    filter:
      - '*.node'

win:
  icon: build/icon.ico
  artifactName: ${productName}-${version}-win-${arch}.${ext}
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

# Linux ships an AppImage (runs on every distro, no root) and a .deb (apt users,
# and the target that gets a real desktop entry). No `depends` on pipewire-utils:
# the package name differs across distros, and the app already degrades to a
# manually chosen input device — with the reason shown in Settings — when
# pw-record is missing.
linux:
  icon: build/icon.png
  category: Utility
  maintainer: lakaka2970
  synopsis: Real-time meeting and interview assistant
  artifactName: ${productName}-${version}-linux-${arch}.${ext}
  # A platform-level `files` list REPLACES the global one (verified: listing only
  # the negations below dropped the `out/**` positive, and electron-builder fell
  # back to its default include-everything — 308 extra entries landed in app.asar,
  # among them docs/MeetingAssistant-demo.mp4 and README.pdf). So the global
  # patterns are repeated here; keep the two lists in sync.
  #
  # The Linux-only negations drop payload that is never loaded on this platform:
  # shared/platform.ts asks onnxruntime for ['cpu'] off Windows and ['dml','cpu']
  # on it, so the CUDA/TensorRT providers (327 MB) are dead weight, as are the
  # darwin/arm64 prebuilts and the musl builds of the native image libraries.
  # libonnxruntime.so.1.21.0 is the versioned twin of the SONAME the binding
  # actually links (DT_NEEDED libonnxruntime.so.1, RUNPATH $ORIGIN/).
  files:
    - out/**
    - package.json
    - '!src/**'
    - '!test/**'
    - '!docs/**'
    - '!tools/**'
    - '!patches/**'
    - '!build/**'
    - '!.github/**'
    - '!**/*.md'
    - '!**/*.tsbuildinfo'
    - '!electron.vite.config.ts'
    - '!tsconfig*.json'
    - '!**/{.npmrc,.editorconfig,start.bat,start-funasr-local.bat}'
    - '!**/*.map'
    - '!**/*.ts'
    - '!**/*.tsx'
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime_providers_cuda.so'
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime_providers_tensorrt.so'
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/x64/libonnxruntime.so.1.21.0'
    - '!node_modules/onnxruntime-node/bin/napi-v3/linux/arm64/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/darwin/**'
    - '!node_modules/onnxruntime-node/bin/napi-v3/win32/**'
    - '!node_modules/@napi-rs/canvas-linux-x64-musl/**'
    - '!node_modules/@img/sharp-libvips-linuxmusl-x64/**'
    # 65.8 MB of browser-only ONNX Runtime (52 MB of .wasm plus every ort.*.js
    # variant). transformers.js bundles `onnxruntime-web` as an IGNORED module
    # in its Node build, so the dynamic import can never resolve here — verified
    # by loading the packaged transformers.node.mjs with this excluded.
    - '!node_modules/onnxruntime-web/**'
    # Browser-only ONNX Runtime wasm that the Node bundle never references
    # (grep of transformers.node.mjs: zero hits for 'ort-wasm'/'jsep'), and the
    # pdfjs-dist copies pdf-parse does not load — it imports
    # pdfjs-dist/legacy/build/pdf.mjs, so build/ and web/ are dead here.
    - '!node_modules/@huggingface/transformers/dist/ort-wasm-simd-threaded.jsep.wasm'
    - '!node_modules/@huggingface/transformers/dist/ort-wasm-simd-threaded.jsep.mjs'
    # the same artifact under the name @huggingface/transformers ships it in the
    # install tree; both spellings are excluded because the pattern that matches
    # neither would silently save nothing
    - '!node_modules/@huggingface/transformers/dist/jsep.wasm'
    - '!node_modules/@huggingface/transformers/dist/jsep.mjs'
    - '!node_modules/pdfjs-dist/build/**'
    - '!node_modules/pdfjs-dist/web/**'
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
  # login autostart is written by electron/autostartLinux.ts, not by a packaged
  # desktop file: an AppImage mounts at a random /tmp path per boot, so only the
  # running app knows the right Exec target (process.env.APPIMAGE).
  desktop:
    entry:
      Name: MeetingAssistant
      StartupWMClass: meetingassistant

nsis:
  oneClick: true
  perMachine: false
  allowToChangeInstallationDirectory: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: MeetingAssistant
  # meeting notes, sessions and API keys live in %APPDATA%\MeetingAssistant --
  # an uninstall (or an upgrade, which uninstalls first) must never wipe them
  deleteAppDataOnUninstall: false

portable:
  artifactName: ${productName}-${version}-win-${arch}-portable.${ext}

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # TEMPORARY PROBE (2026-10-11): reproduces the release job's two gh calls against the
  # live repo and files what they return, so the failing PATCH step in release.yml can be
  # diagnosed in a 4-minute CI run instead of a 10-minute release rebuild. Delete with the
  # release-notes wiring once it is green.
  release-notes-probe:
    name: probe the release body patch (temporary)
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v1.0.3
    steps:
      - uses: actions/checkout@v4
      - name: Report what the patch step sees
        run: |
          {
            echo "## files present"
            ls -la docs/user/ | grep RELEASE_NOTES || true
            echo
            echo "## releases list (id, tag, draft, target)"
            gh api "repos/$GITHUB_REPOSITORY/releases" --jq '.[] | [.id, .tag_name, .draft, .target_commitish] | @tsv' || echo "LIST FAILED"
            echo
            echo "## the exact select the patch step uses"
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == env(TAG)) | .id" | head -n 1) || echo "SELECT FAILED rc=$?"
            echo "resolved id: [${id}]"
            echo
            echo "## gh version"
            gh --version
          } > probe.md 2>&1
          gh issue create --repo "$GITHUB_REPOSITORY" --title "release-body probe ($TAG)" --body-file probe.md
  windows:
    name: typecheck, test, build (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # tools/*.py are import-only stdlib modules; a bare interpreter is enough
      # (no torch / funasr / transformers needed for the unit tests)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # npm ci runs postinstall -> patch-package, which is what keeps
      # transformers.js patched for whisper-large-v3-turbo
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Python sidecar tests
        run: npm run test:python

      - name: Build
        run: npm run build

      - name: Verify transformers.js patch survived
        run: npm run verify:patched

  # Linux is a supported runtime, not just a build host: the PipeWire tap, the
  # XDG autostart entry and the display-backend relaunch all live here. The
  # interactive checks (tools/linux-verify.mjs) need a real session with
  # PipeWire and a tray host, so they stay out of CI and run on a desktop.
  linux:
    name: typecheck, test, build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Python sidecar tests
        run: npm run test:python

      - name: Build
        run: npm run build

      - name: Verify transformers.js patch survived
        run: npm run verify:patched

      # proves the linux target in electron-builder.yml actually resolves (icon,
      # extraResources, asarUnpack) without producing release artifacts
      - name: Package (unpacked)
        run: npx electron-builder --dir --linux

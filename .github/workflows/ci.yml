name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: typecheck, test, build (windows)
    runs-on: windows-latest
    # contents:read keeps the checkout working; issues:write is only used by the
    # temporary diagnostic step below, which files the failure tail as an issue.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # tools/*.py are import-only stdlib modules; a bare interpreter is enough
      # (no torch / funasr / transformers needed for the unit tests)
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # npm ci runs postinstall -> patch-package, which is what keeps
      # transformers.js patched for whisper-large-v3-turbo
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # TEMPORARY DIAGNOSTIC (2026-10-11, v1.0.3 release prep) - delete once the
      # Windows-only failure is fixed. GitHub will not serve a job log to an
      # unauthenticated client, so instead of blocking the release on someone
      # pasting it, the runner re-runs the suite on failure and files the tail as an
      # issue, which the public API does expose.
      - name: File the failing test tail (temporary diagnostic)
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          npx vitest run > vitest-tail.log 2>&1 || true
          {
            echo "run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "commit: ${{ github.sha }}"
            printf '```\n'
            tail -n 100 vitest-tail.log
            printf '```\n'
          } > tail.md
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "ci(windows): unit-test tail at ${{ github.sha }}" \
            --body-file tail.md

      - name: Python sidecar tests
        run: npm run test:python

      - name: Build
        run: npm run build

      - name: Verify transformers.js patch survived
        run: npm run verify:patched

  # Linux is a supported runtime, not just a build host: the PipeWire tap, the
  # XDG autostart entry and the display-backend relaunch all live here. The
  # interactive checks (tools/linux-verify.mjs) need a real session with
  # PipeWire and a tray host, so they stay out of CI and run on a desktop.
  linux:
    name: typecheck, test, build (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Python sidecar tests
        run: npm run test:python

      - name: Build
        run: npm run build

      - name: Verify transformers.js patch survived
        run: npm run verify:patched

      # proves the linux target in electron-builder.yml actually resolves (icon,
      # extraResources, asarUnpack) without producing release artifacts
      - name: Package (unpacked)
        run: npx electron-builder --dir --linux

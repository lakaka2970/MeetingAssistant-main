name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # One build job per platform. Each one only has to upload an artifact; the
  # `release` job below collects whatever is there. Adding macOS later means
  # copying this job with runs-on: macos-latest and `electron-builder --mac`,
  # nothing else changes.
  build-windows:
    name: build windows installers
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typecheck + unit tests + build; dist:win re-runs the build and also
      # hard-fails if patch-package did not survive the install
      - name: Verify
        run: npm run verify

      - name: Build installers
        run: npm run dist:win

      # unsigned build: publish checksums so users can at least verify the
      # download matches what CI produced
      - name: Compute SHA256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release -Filter *.exe -File | ForEach-Object {
            $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            $line = "$hash  $($_.Name)"
            Set-Content -Path "$($_.FullName).sha256" -Value $line -Encoding ascii
            Write-Host $line
          }

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            release/*.exe
            release/*.exe.sha256
          if-no-files-found: error
          retention-days: 14

  build-linux:
    name: build linux packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: npm run verify

      # AppImage + deb. No `depends:` on pipewire-utils in electron-builder.yml:
      # the package name differs per distro and the app degrades to a manually
      # chosen input device (with the reason in Settings) when pw-record is absent.
      - name: Build packages
        run: npm run dist:linux

      - name: Compute SHA256 checksums
        run: |
          for f in release/*.AppImage release/*.deb; do
            [ -e "$f" ] || continue
            sha256sum "$f" | tee "$f.sha256"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            release/*.AppImage
            release/*.AppImage.sha256
            release/*.deb
            release/*.deb.sha256
          if-no-files-found: error
          retention-days: 14

  # build-macos:
  #   Add when the macOS target lands. Upload as `macos-installers`; the
  #   release job picks it up automatically via download-artifact's glob.

  release:
    name: draft github release
    needs: [build-windows, build-linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List collected files
        run: find artifacts -type f -printf '%10s  %p\n'

      # draft, never auto-published: a human checks the binaries and clicks Publish.
      # The notes come from the repo, not from whoever is releasing: docs/user/
      # RELEASE_NOTES_<tag>.md becomes the draft body (the auto changelog is appended
      # under it), so a release cannot go out with only a compare link. If a future
      # tag has no notes file the action fails here — that is the forcing function,
      # not a bug; write the file (or pass an empty one) before tagging.
      # generate_release_notes stays OFF on purpose: GitHub ignores body/body_path when
      # it is true, so turning it on silently discards the notes (seen on the first
      # v1.0.3 build, where the draft came back with nothing but the compare line).
      # The compare link the auto-notes used to add is written into the notes file.
      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: false
          body_path: docs/user/RELEASE_NOTES_${{ github.ref_name }}.md
          fail_on_unmatched_files: true
          files: artifacts/**/*

      # The action creates a release with the body, but it does not rewrite the body of
      # a release that already exists — proven by the first two v1.0.3 builds, where the
      # draft kept nothing but the compare line no matter what body_path pointed at. So
      # patch it afterwards through the API, which has no such exception. Re-tagging an
      # existing version now actually updates its notes.
      - name: Put the repo notes into the release body
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" \
                 --jq ".[] | select(.tag_name == env(TAG)) | .id" | head -n 1)
          if [ -z "$id" ]; then
            echo "no release found for $TAG" >&2
            exit 1
          fi
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -F body="@docs/user/RELEASE_NOTES_${TAG}.md" \
            --jq '"body set: \(.body | split("\n")[0]) (\(.body | length) chars)"'
